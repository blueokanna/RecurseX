[package]
name = "recurse-x"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["blueokanna", "HyphenTeam"]
description = "A predictive adaptive recursive DNS resolver with a stability-aware multi-tier semantic cache, resolution graph, and adaptive upstream selection."
homepage = "https://github.com/blueokanna/RecurseX"
repository = "https://github.com/blueokanna/RecurseX"
readme = "README.md"
keywords = ["dns", "resolver", "recursive", "dnssec", "network"]
categories = ["network-programming"]
exclude = [
    "target/",
    "**/*.log",
    "**/*.err",
    ".github/",
    ".gitignore",
    "Cargo.lock",
    "rust-toolchain.toml",
    "wiki/",
    ".vscode/",
]

[features]
default = ["std", "dot", "doh", "doh3", "dnssec", "persist"]
std = []
dnssec = ["std", "dep:courierust"]
dot = ["std", "dep:courierust"]
doh = ["std", "dep:courierust"]
doh3 = ["std", "doh"]
doq = ["std", "dep:courierust"]
persist = ["std", "dep:rustbinary"]

[dependencies]
nextjson = { version = "0.1.4", default-features = false, features = ["derive"] }
tzcraft = { version = "0.1", default-features = false, features = ["alloc"] }
rustbinary = { version = "0.1.8", default-features = false, features = [
    "std",
    "derive",
    "fingerprint",
    "static-size",
    "reflection",
], optional = true }
courierust = { version = "1.0.3", optional = true }

[[example]]
name = "persist_cache"
required-features = ["persist"]

[dev-dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
